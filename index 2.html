<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7fb"><title>영단어 암기장</title><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202235;--muted:#777b8d;--line:#e7e8ef;--accent:#6657d9;--good:#168451;--bad:#d64b54;--star:#e7a51a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,button,select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink);cursor:pointer}.tab.active,button.primary{background:var(--accent);border-color:var(--accent);color:white}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 6px 24px #24234a0a}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:13px}.word{font-size:34px;font-weight:750;letter-spacing:-.7px;margin:24px 0 18px;overflow-wrap:anywhere}.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:15px;font-size:17px;outline:none}.input:focus{border-color:var(--accent)}.feedback{margin-top:14px;border-radius:12px;padding:13px;font-weight:650;display:none}.feedback.good{display:block;color:var(--good);background:#eaf7f0}.feedback.bad{display:block;color:var(--bad);background:#fff0f0}.answer{margin-top:10px;padding:13px;border-radius:12px;background:#f5f5fa;display:none;line-height:1.6}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.actions button{flex:1}.star{font-size:24px;border:0;background:transparent;padding:4px;color:#b7b8c3}.star.on{color:var(--star)}.progress{height:7px;background:#eeeef5;border-radius:9px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--accent);width:0}.list{display:grid;gap:9px;m </style></head><body><main class="wrap"><header class="top"><div><h1>영단어 암기장</h1><div class="sub">DAY 선택 · 뜻 입력 · 즉시 채점 · 별표 단어</div></div><button id="starTab">☆ 별표 <span id="starCount">0</span></button></header><div class="tabs" id="dayTabs"></div><section class="panel" id="quiz"><div class="row"><span class="muted" id="dayLabel">DAY 21</span><span class="muted" id="countLabel">1 / 20</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="row"><span class="muted">영어 단어의 뜻을 입력해 봐.</span><button class="star" id="starBtn" title="별표 저장">☆</button></div><div class="word" id="word">urban</div><input class="input" id="meaningInput" placeholder="한국어 뜻 입력" autocomplete="off"><div class="feedback" id="feedback"></div><div class="answer" id="answer"></div><div class="actions"><button id="checkBtn" class="primary">정답 확인</button><button id="nextBtn">다음 단어 →</button></div></section><section class="panel hide" id="starPage"><div class="row"><div><b style="font-size:19px">☆ 별표 단어</b><div class="muted">저장한 단어를 모아볼 수 있어.</div></div><button id="backBtn">시험으로</button></div><div id="starList" class="list"></div></section><p class="muted" style="text-align:center;margin-top:18px">별표와 학습 위치는 이 기기에 자동 저장돼.</p></main><script>
const DATA={"21": [["urban", "도시의"], ["regeneration", "재생, 재건"], ["degraded", "낙후된, 노후화된"], ["promote", "추진하다, 장려하다"], ["resident", "거주자, 주민"], ["injustice", "불평등, 부당함"], ["improvement", "개선, 호전"], ["ethnic", "소수 민족의"], ["low-income", "저소득층의"], ["paradox", "역설"], ["attractiveness", "매력"], ["desirable", "탐나는"], ["afford", "~할 여유가 되다"], ["result in", "~을 야기하다"], ["exclusion", "배제, 제외"], ["displacement", "퇴거"], ["intend to", "~을 의도하다"], ["ecosystem", "생태계"], ["access", "접근성"], ["infrastructure", "사회 기반 시설"]], "22": [["increasing", "커지는, 증가하는"], ["awareness", "인식, 의식"], ["agenda", "안건, 의제"], ["overdue", "미뤄 온, (진작) 했어야 할"], ["massive", "거대한"], ["obstacle", "장애물"], ["initially", "애초에, 처음에"], ["kidney", "신장, 콩팥"], ["vague", "막연한, 모호한"], ["decline", "감소, 하락"], ["the Southern Ocean", "남극해"], ["context", "맥락, 문맥"], ["appropriate", "적절한"], ["take action", "~에 대한 조치를 취하다"], ["seep", "스며들다"], ["throne", "왕위, 왕좌"], ["virtue", "덕성, 미덕"], ["merit", "공로, 공적"], ["empire", "제국"], ["expand", "확장되다"], ["continent", "대륙"], ["eagerly", "적극적으로, 열렬하게"], ["adopt", "채택하다"], ["absorb", "흡수하다"], ["incoming", "유입되는, 들어오는"], ["complain about", "~에 대해 불평하다"], ["rapid", "급격한, 빠른"]], "23": [["melting pot", "용광로, 도가니"], ["claim", "주장하다"], ["be comprised of", "~로 구성되다"], ["immigrant", "이민자, 이주민"], ["flood in", "물려들다, 쇄도하다"], ["from all directions", "사방에서"], ["deliberate", "의도적인, 계획적인"], ["nondiscrimination", "비차별, 무차별"], ["initial", "초기의, 처음의"], ["openness", "개방성"], ["assert", "주장하다"], ["lay the foundation", "토대를 놓다, 기초를 다지다"], ["multicultural", "다문화적인"], ["foundation", "설립"], ["minority", "소수"], ["legendary", "전설적인"]], "24": [["physics", "물리학"], ["fundamental", "근본적인, 본질적인"], ["precise", "정밀한, 정확한"], ["slightly", "약간, 조금"], ["gravity", "중력"], ["enable", "가능하게 하다"], ["dust", "(흙) 먼지"], ["particle", "입자, 조각"], ["proto-star", "원시 항성"], ["come to orbit", "공전하게 되다"], ["electron", "전자"], ["chemistry", "화학 반응"], ["organic", "유기 의"], ["evolve", "진화하다"], ["privileged", "특권이 있는"], ["advanced", "고등의"], ["const ate", "열정을 가진"], ["rank", "순위를 매기다"], ["likeness", "유사성"], ["privilege", "특권"], ["theoretical", "이론적인"], ["approach", "접근"], ["irrelevant", "무관한, 상관없는"], ["deserve", "마땅히 누려야 하다"], ["characteristic", "고유한"], ["lazily", "성의 없이"], ["picture", "~를 상상하다"], ["lesser", "열등한"], ["creature", "생명체"], ["flourish", "번영하다"], ["finch", "핀치(부리가 짧은 작은 새)"], ["sentient", "지각 능력이 있는"]], "35": [["serve as", "~로 작용하다"], ["context", "맥락, 문맥"], ["facilitate", "촉진하다, 조장하다"], ["autobiographical", "자전적인"], ["independent of", "~와는 무관하게"], ["characteristic", "특성, 특징"], ["rehearse", "~을 되풀이하다"], ["make sense of", "~을 이해하다"], ["comments", "댓글"], ["periodic", "주기적인"], ["reminder", "알림"], ["cue", "단서, 신호"], ["comparison", "비교"], ["self-esteem", "자존감"], ["browse", "(인터넷을) 돌아다니다, 검색하다"], ["stabilize", "안정시키다"], ["retention", "유지"]], "36": [["multisensory", "다중 감각의"], ["take ~ for granted", "~을 당연하게 여기다"], ["function", "작동하다, 기능하다"], ["normally", "정상적으로"], ["aid", "보조 도구"], ["inspection", "살펴보는 것"], ["ordinary", "평범한"], ["remarkable", "놀라운, 주목할 만한"], ["fusion", "융합, 결합"], ["countless", "수많은, 무수한"], ["texture", "질감, 감촉"], ["atmosphere", "상황, 환경"]], "37": [["principle", "원리, 원칙"], ["foreign", "낯선"], ["perceive", "인식하다"], ["separately", "분리해서, 따로따로"], ["one another", "서로"], ["vivid", "생생한"], ["automatically", "자동적으로"]], "38": [["humanity", "인류, 인간"], ["sociality", "사회성"], ["relative", "동족, 동류"], ["collectively", "집단적으로"], ["colony", "군집"], ["impressively", "인상적으로"], ["hexagonal", "육각형의"], ["march", "행진하다"], ["in lines", "줄지어"], ["formation", "대형(편대)"], ["recur", "반복되다"], ["predictably", "예측할 수 있게"], ["tightly", "긴밀하게"], ["genetically", "유전적으로"], ["propel", "추진하다"], ["pheromonally", "페로몬에 의해"], ["dynamic", "역동적인"], ["in harmony with", "~와 조화를 이루는"], ["nurture", "양육, 육성"], ["nature", "본성, 천성"], ["termite", "흰개미"], ["metric", "측정 기준"], ["choreography", "안무"]], "39": [["purchase", "구매하다, 구입하다"], ["personal use", "개인적인 용도"], ["being", "존재, 실재"], ["invent", "고안하다, 만들어 내다"], ["ensure", "반드시 ~하게 하다"]], "40": [["partner", "협력하다"], ["motivating effect", "동기 부여 효과"], ["illusory", "착각된, 착각을 일으키는"], ["progress", "진전"], ["open slot", "빈칸"], ["strictly speaking", "엄밀히 말하면"], ["identical", "동일한"], ["appeal", "매력"], ["out of", "~중에"], ["reach", "~에 도달하다"], ["finish line", "결승선"], ["perceive", "인식하다"]]};
let day='21',index=0,stars=JSON.parse(localStorage.getItem('vocabStars')||'[]'),starMode=false;
const $=id=>document.getElementById(id);const words=()=>DATA[day]||[];
function save(){localStorage.setItem('vocabStars',JSON.stringify(stars));$('starCount').textContent=stars.length}
function renderTabs(){ $('dayTabs').innerHTML=Object.keys(DATA).map(d=>`<button class="tab ${d===day?'active':''}" data-day="${d}">${d}번</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;index=0;starMode=false;showQuiz();renderTabs()}) }
function render(){let arr=words(),w=arr[index];$('dayLabel').textContent=`DAY ${day}`;$('countLabel').textContent=`${index+1} / ${arr.length}`;$('bar').style.width=`${(index+1)/arr.length*100}%`;$('word').textContent=w[0];$('meaningInput').value='';$('feedback').className='feedback';$('feedback').textContent='';$('answer').style.display='none';$('answer').textContent='';$('starBtn').textContent=stars.includes(day+'|'+index)?'★':'☆';$('starBtn').classList.toggle('on',stars.includes(day+'|'+index));$('meaningInput').focus()}
function normalize(s){return s.toLowerCase().replace(/[~·]/g,'').replace(/[\s,，、/]+/g,'').replace(/[.!?]/g,'').trim()}
function check(){let w=words()[index],given=normalize($('meaningInput').value),answer=normalize(w[1]);if(!given){$('feedback').className='feedback bad';$('feedback').textContent='뜻을 먼저 입력해 줘.';return}let variants=w[1].split(/[,;；]/).map(normalize);let ok=variants.some(v=>v===given)||given===answer;$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'정답이야! 잘했어.':'아쉬워! 정답을 확인해 봐.';$('answer').style.display='block';$('answer').innerHTML='<b>정답</b><br>'+w[1]}
function next(){index=(index+1)%words().length;render()}
function toggleStar(){let key=day+'|'+index;if(stars.includes(key))stars=stars.filter(x=>x!==key);else stars.push(key);save();$('starBtn').textContent=stars.includes(key)?'★':'☆';$('starBtn').classList.toggle('on',stars.includes(key))}
function showQuiz(){$('quiz').classList.remove('hide');$('starPage').classList.add('hide');render()}
function showStars(){$('quiz').classList.add('hide');$('starPage').classList.remove('hide');$('starList').innerHTML='';let items=stars.map(k=>{let [d,i]=k.split('|');return {d,i:+i,w:DATA[d]?.[+i]}}).filter(x=>x.w);if(!items.length){$('starList').innerHTML='<div class="empty">아직 별표한 단어가 없어.<br>시험 화면에서 ☆를 눌러 저장해 봐!</div>';return}items.forEach(x=>{let el=document.createElement('div');el.className='item';el.innerHTML=`<div><b>${x.w[0]}</b><small>DAY ${x.d} · ${x.w[1]}</small></div><button aria-label="별표 해제">★</button>`;el.querySelector('button').onclick=()=>{stars=stars.filter(k=>k!==x.d+'|'+x.i);save();showStars()};$('starList').appendChild(el)})}
$('checkBtn').onclick=check;$('nextBtn').onclick=next;$('starBtn').onclick=toggleStar;$('starTab').onclick=showStars;$('backBtn').onclick=showQuiz;$('meaningInput').addEventListener('keydown',e=>{if(e.key==='Enter')check()});save();renderTabs();render();
</script></body></html>
